<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="7" dy="9" stdDeviation="5" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="26"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .028"/></feComponentTransfer>
    </filter>
    <style>
      .title { font-family: "Times New Roman", Georgia, serif; font-size: 31px; letter-spacing: -1.2px; fill:#090909; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 8px; letter-spacing: 2.1px; fill:#111; }
      .value { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill:#111; }
      .nav { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill:#111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 9px; letter-spacing:1.5px; fill:#1a1a1a; }
      .stat { font-family:"Times New Roman", Georgia, serif; font-size:22px; fill:#0a0a0a; }
      .desc { font-family:"Times New Roman", Georgia, serif; font-size:20px; fill:#111; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f6f6f3"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity=".34"/>

