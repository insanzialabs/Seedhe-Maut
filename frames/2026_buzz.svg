  <text x="285" y="61" text-anchor="end" class="value"><tspan x="285" dy="0">Seedhe Maut</tspan><tspan x="285" dy="19">KR$NA</tspan></text>

  <line x1="7" y1="103" x2="288" y2="103" stroke="#111" stroke-width=".65"/>
